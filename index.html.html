<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모루아SMP 콘텐츠 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f5f0eb;font-family:'Noto Sans KR',sans-serif;min-height:100vh}
  .bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(180,150,120,.08),transparent 50%),radial-gradient(circle at 80% 80%,rgba(140,110,90,.06),transparent 50%);pointer-events:none}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 60px;position:relative}
  .header{display:flex;align-items:center;gap:16px;margin-bottom:32px}
  .logo-mark{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#8B6F55,#C4A882);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif;font-size:24px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 4px 16px rgba(139,111,85,.3)}
  .logo-text{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;color:#3d2c1e;letter-spacing:.02em}
  .slogan{font-size:11px;color:#8B6F55;margin-top:3px;letter-spacing:.04em}
  .card{background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 2px 24px rgba(100,70,50,.08);border:1px solid rgba(180,150,120,.15)}
  .mode-row{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
  .mode-btn{flex:1;min-width:100px;padding:10px 8px;border:1.5px solid #e0d4c8;border-radius:12px;background:transparent;color:#8B6F55;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
  .mode-btn.active{background:#8B6F55;border-color:#8B6F55;color:#fff;box-shadow:0 2px 10px rgba(139,111,85,.25)}
  .field-group{margin-bottom:20px}
  label{display:block;font-size:12px;font-weight:500;color:#7a6050;margin-bottom:8px;letter-spacing:.05em}
  input,textarea{width:100%;padding:12px 16px;border:1.5px solid #e0d4c8;border-radius:12px;font-size:14px;font-family:'Noto Sans KR',sans-serif;color:#3d2c1e;background:#fdfaf7;outline:none;transition:border-color .2s}
  input:focus,textarea:focus{border-color:#C4A882}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{padding:5px 12px;border-radius:20px;border:1px solid #e0d4c8;background:#fdfaf7;color:#8B6F55;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
  .chip:hover,.chip.active{background:#C4A882;border-color:#C4A882;color:#fff}
  .seg{display:flex;gap:8px}
  .seg-btn{padding:8px 16px;border:1.5px solid #e0d4c8;border-radius:10px;background:transparent;color:#8B6F55;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s}
  .seg-btn.active{background:#C4A882;border-color:#C4A882;color:#fff}
  .gen-btn{width:100%;padding:16px;background:linear-gradient(135deg,#8B6F55,#C4A882);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;letter-spacing:.05em;box-shadow:0 4px 16px rgba(139,111,85,.3);transition:all .2s;margin-top:4px}
  .gen-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .result-card{margin-top:20px;background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 24px rgba(100,70,50,.08);border:1px solid rgba(180,150,120,.15)}
  .result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .result-label{font-size:12px;font-weight:500;color:#8B6F55;letter-spacing:.05em}
  .copy-btn{padding:6px 14px;border-radius:8px;border:1.5px solid #C4A882;background:transparent;color:#8B6F55;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
  .copy-btn:hover{background:#C4A882;color:#fff}
  .result-text{font-size:13.5px;line-height:1.9;color:#3d2c1e;white-space:pre-wrap;word-break:break-word;font-family:'Noto Sans KR',sans-serif}
  .footer{text-align:center;margin-top:28px;font-size:11px;color:#b8a898;letter-spacing:.04em}
  .hidden{display:none}
  .loading{display:inline-flex;align-items:center;gap:4px}
  .dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:bounce .9s infinite}
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <header class="header">
    <div class="logo-mark">M</div>
    <div>
      <h1 class="logo-text">모루아SMP</h1>
      <p class="slogan">그 마음 알기에, 자연스럽게 채워지는 자신감</p>
    </div>
  </header>

  <div class="card">
    <div class="mode-row">
      <button class="mode-btn active" data-mode="instagram">📸 인스타그램 캡션</button>
      <button class="mode-btn" data-mode="blog">📝 네이버 블로그 초안</button>
      <button class="mode-btn" data-mode="card">🃏 카드뉴스 카피</button>
    </div>

    <div class="field-group">
      <label>주제 / 키워드</label>
      <input type="text" id="topic" placeholder="예: SMP란 무엇인가요?" />
      <div class="chips">
        <button class="chip" onclick="setTopic(this)">SMP란 무엇인가요?</button>
        <button class="chip" onclick="setTopic(this)">가르마 두피문신 후기</button>
        <button class="chip" onclick="setTopic(this)">탈모 초기 대처법</button>
        <button class="chip" onclick="setTopic(this)">SMP 지속 기간과 관리</button>
        <button class="chip" onclick="setTopic(this)">두피문신 vs 모발이식 비교</button>
        <button class="chip" onclick="setTopic(this)">SMP 시술 과정 안내</button>
      </div>
    </div>

    <!-- blog options -->
    <div class="field-group hidden" id="blog-opts">
      <label>카테고리</label>
      <div class="seg">
        <button class="seg-btn active" data-cat="두피문신(SMP)">두피문신(SMP)</button>
        <button class="seg-btn" data-cat="탈모정보">탈모정보</button>
      </div>
    </div>

    <!-- card options -->
    <div class="field-group hidden" id="card-opts">
      <label>슬라이드 수</label>
      <div class="seg">
        <button class="seg-btn" data-count="3">3장</button>
        <button class="seg-btn active" data-count="5">5장</button>
        <button class="seg-btn" data-count="7">7장</button>
      </div>
    </div>

    <div class="field-group">
      <label>추가 메모 (선택)</label>
      <input type="text" id="extra" placeholder="강조하고 싶은 포인트나 특이사항" />
    </div>

    <button class="gen-btn" id="gen-btn" onclick="generate()">✦ 콘텐츠 생성하기</button>
  </div>

  <div class="result-card hidden" id="result-card">
    <div class="result-header">
      <span class="result-label" id="result-label"></span>
      <button class="copy-btn" onclick="copyResult()">복사하기</button>
    </div>
    <pre class="result-text" id="result-text"></pre>
  </div>

  <p class="footer">모루아SMP 전용 콘텐츠 생성기 · powered by Claude</p>
</div>

<script>
const BRAND_TONE = `당신은 모루아SMP의 콘텐츠 작가입니다.
브랜드 슬로건: "그 마음 알기에, 자연스럽게 채워지는 자신감"
톤앤매너: 탈모로 고민하는 분들의 마음을 먼저 공감하고, 전문가적 신뢰를 바탕으로 자연스럽게 정보를 전달합니다.
- 따뜻하고 공감적인 어조
- "케어"를 "시술" 대신 사용
- "두피문신"은 검색 노출을 위해 사용
- 어색하거나 갑작스러운 도입부 금지, 공감으로 시작
- "다만," 같은 전환어 사용 자제
- 숨겨진 정보가 있는 듯한 뉘앙스 금지
- 인천 기반 SMP 전문 브랜드임을 자연스럽게 드러냄`;

const HASHTAGS = "#모루아SMP #인천SMP #인천두피문신 #두피문신 #SMP #탈모 #두피케어 #SMP후기 #인천미용 #두피문신인천";

let currentMode = "instagram";
let blogCat = "두피문신(SMP)";
let cardCount = 5;

// Mode buttons
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMode = btn.dataset.mode;
    document.getElementById("blog-opts").classList.toggle("hidden", currentMode !== "blog");
    document.getElementById("card-opts").classList.toggle("hidden", currentMode !== "card");
  });
});

// Blog cat buttons
document.querySelectorAll("[data-cat]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-cat]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    blogCat = btn.dataset.cat;
  });
});

// Card count buttons
document.querySelectorAll("[data-count]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-count]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    cardCount = parseInt(btn.dataset.count);
  });
});

function setTopic(el) {
  document.getElementById("topic").value = el.textContent;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
}

function buildPrompt() {
  const topic = document.getElementById("topic").value.trim();
  const extra = document.getElementById("extra").value.trim();

  if (currentMode === "instagram") {
    return {
      system: `${BRAND_TONE}
인스타그램 캡션 작성 규칙:
- 첫 줄은 공감 또는 질문으로 시작 (후킹)
- 본문 3~5문장, 줄바꿈 활용
- 마지막에 CTA 한 줄 (예: 문의는 DM 또는 프로필 링크로)
- 해시태그는 본문 아래 별도 줄에
- 이모지 자연스럽게 1~3개만
응답은 캡션 텍스트만 출력하세요.`,
      user: `주제: ${topic}${extra ? "\n추가 요청: " + extra : ""}`
    };
  }
  if (currentMode === "blog") {
    return {
      system: `${BRAND_TONE}
네이버 블로그 포스팅 작성 규칙:
- 카테고리: ${blogCat}
- 제목 포함 (검색 최적화, 두피문신/SMP/탈모 키워드 자연스럽게 포함)
- 도입부: 공감으로 시작
- 소제목 2~3개 포함 (## 형식)
- 본문 400~600자
- 마무리: 모루아SMP 소개 1~2문장
- 태그 추천 10개 (쉼표 구분)
응답 형식:
[제목]
...
[본문]
...
[태그]
...`,
      user: `주제: ${topic}${extra ? "\n메모: " + extra : ""}`
    };
  }
  if (currentMode === "card") {
    return {
      system: `${BRAND_TONE}
카드뉴스 슬라이드 카피 작성 규칙:
- 슬라이드 수: ${cardCount}장
- 슬라이드 1: 표지 (제목 + 짧은 서브 카피)
- 슬라이드 2~${cardCount - 1}: 핵심 내용 각 1~2문장씩
- 슬라이드 ${cardCount}: 마무리 + CTA (모루아SMP 문의 유도)
- 각 슬라이드는 짧고 임팩트 있게
응답 형식:
[슬라이드 1]
...
[슬라이드 2]
...
이하 동일`,
      user: `주제: ${topic}${extra ? "\n메모: " + extra : ""}`
    };
  }
}

async function generate() {
  const topic = document.getElementById("topic").value.trim();
  if (!topic) return;

  const btn = document.getElementById("gen-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';

  const resultCard = document.getElementById("result-card");
  resultCard.classList.add("hidden");

  try {
    const { system, user } = buildPrompt();
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system,
        messages: [{ role: "user", content: user }]
      })
    });
    const data = await res.json();
    let text = data.content?.[0]?.text || "오류가 발생했어요. 다시 시도해주세요.";

    if (currentMode === "instagram") {
      text = text + "\n\n" + HASHTAGS;
    }

    const labels = { instagram: "📸 인스타그램 캡션", blog: "📝 네이버 블로그 초안", card: "🃏 카드뉴스 카피" };
    document.getElementById("result-label").textContent = labels[currentMode] + " 결과";
    document.getElementById("result-text").textContent = text;
    resultCard.classList.remove("hidden");
    resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) {
    alert("오류가 발생했어요. 다시 시도해주세요.");
  }

  btn.disabled = false;
  btn.innerHTML = "✦ 콘텐츠 생성하기";
}

function copyResult() {
  const text = document.getElementById("result-text").textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector(".copy-btn");
    btn.textContent = "✓ 복사됨";
    setTimeout(() => btn.textContent = "복사하기", 2000);
  });
}
</script>
</body>
</html>
